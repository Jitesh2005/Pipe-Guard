name: PipeGuard Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2️⃣ Install dependencies
      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y jq curl wget python3-pip

          # -----------------------------
          # Install Gitleaks
          # -----------------------------
          curl -fL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.18.0/gitleaks_8.18.0_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz
          sudo mv gitleaks /usr/local/bin/
          rm gitleaks.tar.gz

          gitleaks version

          # -----------------------------
          # Install Semgrep
          # -----------------------------
          pip3 install semgrep
          semgrep --version

          # -----------------------------
          # Install Trivy (FIXED METHOD)
          # -----------------------------
          wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.50.1_Linux-64bit.tar.gz
          tar -xzf trivy_0.50.1_Linux-64bit.tar.gz
          sudo mv trivy /usr/local/bin/
          rm trivy_0.50.1_Linux-64bit.tar.gz

          trivy --version

      # 3️⃣ Run PipeGuard
      - name: Run PipeGuard Security Scan
        run: |
          chmod +x engine/pipeguard.sh
          ./engine/pipeguard.sh
